# XcodeGen spec. `make project` turns this into Tabs.xcodeproj (generated,
# never committed). docs/ARCHITECTURE.md explains the graph; in short:
#
#   TabsPluginSDK.framework   role sdk   the only module plugins see: core's exposed surface
#   TabsCore.framework        role core  plugin runtime, layout, persistence, control — core-private
#   Tabs.app                  role app   AppKit shell: renders the layout, menus, pane chrome
#   <id>.tabsplugin           role plugin — links only the SDK; plugins are isolated from each other
#   Helpers/tabs-ctl          the "control Tabs" skill's relay — links only Foundation
#
# This file holds the rules (target templates) and core's targets. Each plugin
# is a folder, Plugins/<Name>/, whose plugin.yml declares its bundle, its tests
# and its place in the app; `make project` includes every one of them
# (build/plugins.yml, generated), so adding a plugin edits nothing shared.
#
# Every image but tabs-ctl (which shares no types with them: it speaks JSON over
# a socket) carries Resources/TabsBuildStamp.plist (Scripts/stamp-build-info.sh)
# with its role and the shared-ABI fingerprint; the loader and the packaging
# gate (Scripts/verify-app.sh) refuse anything that doesn't match.
name: Tabs

include:
  - path: build/plugins.yml
    relativePaths: false

options:
  bundleIdPrefix: com.hrusoft.tabs
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    # The linker's warnings too: neither setting above reaches ld.
    OTHER_LDFLAGS: $(inherited) -Wl,-fatal_warnings
    # The stamp script reads sources and build configuration and writes the
    # built Info.plist.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    # How many of a test bundle's tests run at once when its scheme entry is
    # parallelizable; 0 is Swift Testing's own: all of them
    # (Tests/Process). A bundle that needs fewer sets its own.
    TEST_PARALLELIZATION_WIDTH: 0
    OTHER_CFLAGS: $(inherited) -DTABS_TEST_PARALLELIZATION_WIDTH=$(TEST_PARALLELIZATION_WIDTH)
    # Lockstep releases: no module stability, no resilience. The shared-ABI
    # fingerprint is what makes that safe.
    BUILD_LIBRARY_FOR_DISTRIBUTION: NO

aggregateTargets:
  # The shared-ABI fingerprint, computed once per build for every image's stamp.
  SharedFingerprint:
    buildScripts:
      - name: Shared-ABI fingerprint
        script: |
          mkdir -p "${OBJROOT}"
          "${SRCROOT}/Scripts/shared-fingerprint.sh" "${CONFIGURATION}" > "${OBJROOT}/TabsSharedFingerprint-${CONFIGURATION}.txt"
        basedOnDependencyAnalysis: false

targetTemplates:
  # Writes Resources/TabsBuildStamp.plist (role + fingerprint). Every target
  # that produces a shipped image uses it.
  Stamped:
    settings:
      base:
        # The version is Config/Base.xcconfig's. XcodeGen's framework preset sets
        # CURRENT_PROJECT_VERSION = 1 on the target, which would hide it.
        CURRENT_PROJECT_VERSION: $(inherited)
    dependencies:
      - target: SharedFingerprint
    postBuildScripts:
      - name: Stamp build info
        script: '"${SRCROOT}/Scripts/stamp-build-info.sh"'
        # Runs every build (its inputs are sources and settings across the
        # project); the declared output orders signing after it.
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/TabsBuildStamp.plist

  # The SDK: a module whose types cross image boundaries. Dynamic, so the
  # process holds exactly one copy; its sources feed the shared-ABI fingerprint.
  SharedFramework:
    templates: [Stamped]
    type: framework
    platform: macOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks @loader_path/../Frameworks"

  # One plugin = one loadable bundle named <pluginID>.tabsplugin whose module is
  # the target name, built from <pluginDir>/Sources with <pluginDir>/Info.plist.
  # Plugins link the SDK (never embed it) and never link core.
  Plugin:
    templates: [Stamped]
    type: bundle
    platform: macOS
    sources:
      - path: ${pluginDir}/Sources
    settings:
      base:
        TABS_IMAGE_ROLE: plugin
        WRAPPER_EXTENSION: tabsplugin
        PRODUCT_NAME: ${pluginID}
        PRODUCT_MODULE_NAME: ${target_name}
        PRODUCT_BUNDLE_IDENTIFIER: com.hrusoft.tabs.plugin.${pluginID}
        INFOPLIST_FILE: ${pluginDir}/Info.plist
        SKIP_INSTALL: YES
        # Resolves against the host app when loaded; the second entry keeps a
        # plugin loadable when something other than Tabs is the executable.
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks @loader_path/../../../../Frameworks"
        # A plugin's own package: `package` declarations of the SDK and of
        # TabsCore stay invisible to it.
        SWIFT_PACKAGE_NAME: ${target_name}
    dependencies:
      - target: TabsPluginSDK
        link: true
        embed: false

  # A plugin's unit tests: its sources compiled into an unhosted test bundle
  # with <pluginDir>/Tests (but for its UI and E2E folders, below), run against
  # the real core runtime (PluginHarness) with no app, no windows and no other
  # plugin. Core's `package` API is visible here (for the harness), never to
  # the plugin's own target.
  PluginTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ${pluginDir}/Sources
      - path: ${pluginDir}/Tests
        excludes: ["UI/**", "E2E/**"]
      - path: Tests/Support
        excludes: [ControlClient.swift]
      - path: Tests/Process
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hrusoft.tabs.tests.${target_name}
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_PACKAGE_NAME: TabsCore
        TEST_HOST: ""
        BUNDLE_LOADER: ""
    dependencies:
      - target: TabsCore
        link: true
        embed: false
      - target: TabsPluginSDK
        link: true
        embed: false

  # A plugin's UI tests (<pluginDir>/Tests/UI): hosted in Tabs.app like
  # TabsAppTests, the real bundles across real image boundaries, driven through
  # the real shell (Tests/AppSupport: UIDriver). They reach the plugin as a
  # user does (views, accessibility ids, chords) and through its Debug verbs,
  # never by importing it.
  PluginUITests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ${pluginDir}/Tests/UI
      - path: Tests/AppSupport
      - path: Tests/Support
      - path: Tests/Process
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hrusoft.tabs.tests.${target_name}
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_PACKAGE_NAME: TabsCore
    dependencies:
      - target: Tabs
      - target: TabsCore
        link: true
        embed: false
      - target: TabsPluginSDK
        link: true
        embed: false

  # A plugin's end-to-end tests (<pluginDir>/Tests/E2E): the built app as its
  # own process, driven over the control socket (Tests/EndToEndSupport:
  # LaunchedApp), with the fixture-text bundle beside the bundled plugins for a
  # pane that is no plugin's own (an agent's caller). Unhosted.
  PluginE2ETests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ${pluginDir}/Tests/E2E
      - path: Tests/EndToEndSupport
      - path: Tests/Support/ControlClient.swift
      - path: Tests/Support/FixtureServer.swift
      - path: Tests/Support/FixtureServer+Standard.swift
      - path: Tests/Process
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hrusoft.tabs.tests.${target_name}
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
        BUNDLE_LOADER: ""
    dependencies:
      - target: Tabs
        link: false
        embed: false
      - target: TabsPluginSDK
        link: true
        embed: false
      - target: FixtureTextPlugin
        link: false
        embed: true
        copy: { destination: resources, subpath: Fixtures }

targets:
  TabsPluginSDK:
    templates: [SharedFramework]
    sources: [Sources/TabsPluginSDK]
    settings:
      base:
        TABS_IMAGE_ROLE: sdk
        PRODUCT_BUNDLE_IDENTIFIER: com.hrusoft.tabs.sdk
        # Shared with core, the shell and tests: `package` = core-only API.
        SWIFT_PACKAGE_NAME: TabsCore

  # The plugin runtime: discovery, resolution, loading, activation, the
  # contribution registry, events, panes, the layout, shortcuts, persistence,
  # control. No windows. Its API is `package`, so nothing outside the TabsCore
  # package can use it even by importing it.
  TabsCore:
    templates: [Stamped]
    type: framework
    platform: macOS
    sources: [Sources/TabsCore]
    settings:
      base:
        TABS_IMAGE_ROLE: core
        PRODUCT_BUNDLE_IDENTIFIER: com.hrusoft.tabs.core
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks @loader_path/../Frameworks"
        SWIFT_PACKAGE_NAME: TabsCore
    dependencies:
      - target: TabsPluginSDK
        link: true
        embed: false

  # Each plugin's plugin.yml adds its bundle to the dependencies (copied into
  # PlugIns) and a TABS_BUNDLED_PLUGIN_<ID> setting: the stamp lists every one
  # of them as the app's bundled plugins, reconciled against PlugIns at launch
  # and by the packaging gate.
  Tabs:
    templates: [Stamped]
    type: application
    platform: macOS
    sources:
      - path: Sources/Tabs
        excludes: [Info.plist, Resources/skills]
      # The "control Tabs" skill (SKILL.md and scripts/tabs-ctl, a stub that runs
      # Contents/Helpers/tabs-ctl), bundled unchanged as Contents/Resources/skills/tabs. Real
      # files rather than anything inside an archive: Settings ▸ AI symlinks it into an agent's
      # skill directory, and the agent's shell runs it as a plain OS process.
      - path: Sources/Tabs/Resources/skills
        type: folder
        buildPhase: resources
    settings:
      base:
        TABS_IMAGE_ROLE: app
        PRODUCT_NAME: Tabs
        PRODUCT_BUNDLE_IDENTIFIER: com.hrusoft.tabs
        INFOPLIST_FILE: Sources/Tabs/Info.plist
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        SWIFT_PACKAGE_NAME: TabsCore
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Keep Debug's bundle layout identical to Release's (no Tabs.debug.dylib).
        ENABLE_DEBUG_DYLIB: NO
      configs:
        # A Debug build (tests, make run) is an app of its own: what macOS keeps by bundle
        # identifier (WebKit's stores, preferences, caches, the default data directory) is
        # never an installed Tabs'.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.hrusoft.tabs.debug
    dependencies:
      - target: TabsPluginSDK
      - target: TabsCore
      # Signed with the app on copy; Helpers, not Resources, because it is code.
      - target: TabsCtl
        embed: true
        codeSign: true
        copy: { destination: wrapper, subpath: Contents/Helpers }

  # `tabs-ctl`: the skill's relay from an agent's shell to the app's control socket. A command-line
  # tool with nothing but Foundation, built and signed with the app, so the two always match.
  TabsCtl:
    type: tool
    platform: macOS
    sources:
      - path: Sources/TabsCtl
    settings:
      base:
        PRODUCT_NAME: tabs-ctl
        PRODUCT_BUNDLE_IDENTIFIER: com.hrusoft.tabs.ctl
        SKIP_INSTALL: YES
        # An Info.plist in the binary: the signature's identifier, and the version the
        # packaging gate holds it to.
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES

  # The relay's rules (Relay.swift: argv, the request, the exit code), unhosted.
  TabsCtlTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Sources/TabsCtl
        excludes: [main.swift]
      - path: Tests/TabsCtlTests
      - path: Tests/Process
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hrusoft.tabs.ctltests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
        BUNDLE_LOADER: ""

  # Test-only plugin: contributes, then throws from activate().
  FixtureThrowingPlugin:
    templates: [Plugin]
    templateAttributes: { pluginID: fixture-throws, pluginDir: Tests/Fixtures/ThrowingPlugin }

  # Test-only plugin: a text pane, a command and a verb, for core's tests that
  # need a plugin bundle but no shipped one (the end-to-end tiers launch the
  # app with it: TABS_E2E_PLUGINS).
  FixtureTextPlugin:
    templates: [Plugin]
    templateAttributes: { pluginID: fixture-text, pluginDir: Tests/Fixtures/TextPlugin }

  # Core logic against in-process plugins. Unhosted: no app launch, no windows.
  TabsCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/TabsCoreTests, Tests/Support, Tests/Process]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hrusoft.tabs.coretests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_PACKAGE_NAME: TabsCore
    dependencies:
      - target: TabsCore
        link: true
        embed: false
      - target: TabsPluginSDK
        link: true
        embed: false

  # Hosted in Tabs.app: real plugin bundles across real image boundaries, the
  # AppKit shell, offscreen snapshots.
  TabsAppTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/TabsAppTests, Tests/AppSupport, Tests/Support, Tests/Process]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hrusoft.tabs.apptests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_PACKAGE_NAME: TabsCore
    dependencies:
      - target: Tabs
      # Linked for their symbols; at run time the test bundle binds to the
      # app's copies, so there is still one of each in the process.
      - target: TabsCore
        link: true
        embed: false
      - target: TabsPluginSDK
        link: true
        embed: false
      - target: FixtureThrowingPlugin
        link: false
        embed: true
        copy: { destination: resources, subpath: Fixtures }
      - target: FixtureTextPlugin
        link: false
        embed: true
        copy: { destination: resources, subpath: Fixtures }

  # The app as a user runs it: launched as its own process (hidden), driven
  # only over the control socket, quit and relaunched. Unhosted.
  TabsEndToEndTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/TabsEndToEndTests
      - Tests/EndToEndSupport
      - Tests/Support/ControlClient.swift
      - Tests/Process
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hrusoft.tabs.e2etests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
        BUNDLE_LOADER: ""
    dependencies:
      # The app under test is a separate process, but it must be the one this
      # build made: built first, never a stale copy.
      - target: Tabs
        link: false
        embed: false
      # JSONValue only.
      - target: TabsPluginSDK
        link: true
        embed: false
      # Launched beside the bundled plugins (TABS_E2E_PLUGINS): a pane no plugin owns.
      - target: FixtureTextPlugin
        link: false
        embed: true
        copy: { destination: resources, subpath: Fixtures }

schemes:
  # Everything: the app, every plugin, all test tiers (plugins add their tests).
  Tabs:
    build:
      targets:
        Tabs: all
        TabsCtlTests: [test]
        TabsCoreTests: [test]
        TabsAppTests: [test]
        TabsEndToEndTests: [test]
    run:
      config: Debug
      environmentVariables:
        TABS_DATA_DIR: $(PROJECT_DIR)/build/dev-data
    test:
      config: Debug
      # A parallelizable bundle runs its suites concurrently (a .serialized suite
      # still runs its own tests in order). The hosted tier stays serial: it drives
      # AppKit's process-wide state (the main menu, the key window, tooltips).
      targets:
        - name: TabsCtlTests
          parallelizable: true
        - name: TabsCoreTests
          parallelizable: true
        - TabsAppTests
        - name: TabsEndToEndTests
          parallelizable: true
  # Core alone: builds the SDK, TabsCore and their tests — nothing else.
  Core:
    build:
      targets:
        TabsCoreTests: [test]
    test:
      config: Debug
      targets:
        - name: TabsCoreTests
          parallelizable: true
  # Every plugin's unit tests (plugins add themselves), without the app.
  Plugins:
    build:
      targets:
        TabsCore: [test]
    test:
      config: Debug
      targets: []
