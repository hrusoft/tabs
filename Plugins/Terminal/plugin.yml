# The Terminal plugin: its bundle, its tests, and its place in the app.
# `make project` includes this file; nothing else in the build names it.
#
# SwiftTerm (the emulator view, docs/TERMINAL.md) is linked statically into
# this plugin and nothing else: one image holds its classes. Pinned to the
# commit of its v1.20.0 tag (a tag can move; Package.resolved lives in the
# generated project, which isn't committed). Its package runs a build-tool
# plugin on every build, hence the Makefile's -skipPackagePluginValidation.
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    revision: 5d14406844143538cd8f8851d2d8a67c1fe443e5
targets:
  TerminalPlugin:
    templates: [Plugin]
    templateAttributes: { pluginID: terminal, pluginDir: Plugins/Terminal }
    dependencies:
      - package: SwiftTerm
  TerminalPluginTests:
    templates: [PluginTests]
    templateAttributes: { pluginDir: Plugins/Terminal }
    dependencies:
      - package: SwiftTerm
  TerminalPluginUITests:
    templates: [PluginUITests]
    templateAttributes: { pluginDir: Plugins/Terminal }
  TerminalPluginE2ETests:
    templates: [PluginE2ETests]
    templateAttributes: { pluginDir: Plugins/Terminal }
  Tabs:
    dependencies:
      - target: TerminalPlugin
        link: false
        embed: true
        copy: { destination: plugins }
    settings:
      base:
        TABS_BUNDLED_PLUGIN_TERMINAL: terminal
schemes:
  Tabs:
    test:
      # The unit and end-to-end suites run at once (each shell, pane and app is
      # their own); the UI tier drives AppKit's shared state and stays serial.
      targets:
        - name: TerminalPluginTests
          parallelizable: true
        - TerminalPluginUITests
        - name: TerminalPluginE2ETests
          parallelizable: true
  Plugins:
    test:
      targets:
        - name: TerminalPluginTests
          parallelizable: true
